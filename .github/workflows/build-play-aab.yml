name: Build Google Play AAB

on:
  workfname: Build Google Play AAB

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: "Mot de passe du keystore (a conserver)"
        required: true
        type: string
      key_password:
        description: "Mot de passe de la cle (a conserver)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Creer la cle de signature
        env:
          STORE_PASS: ${{ inputs.keystore_password }}
          KEY_PASS: ${{ inputs.key_password }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore beuhbeuh48-release.jks \
            -storetype PKCS12 \
            -storepass "$STORE_PASS" \
            -alias beuhbeuh48 \
            -keypass "$STORE_PASS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=BEUHBEUH48, OU=Mobile, O=BEUHBEUH48, L=Paris, ST=Ile-de-France, C=FR"

      - name: Compiler le bundle Release
        run: gradle :app:bundleRelease

      - name: Preparer le fichier AAB
        run: |
          cp app/build/outputs/bundle/release/app-release.aab BEUHBEUH48-v1.aab

      - name: Signer le fichier AAB
        env:
          STORE_PASS: ${{ inputs.keystore_password }}
        run: |
          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore beuhbeuh48-release.jks \
            -storepass "$STORE_PASS" \
            -keypass "$STORE_PASS" \
            BEUHBEUH48-v1.aab \
            beuhbeuh48

      - name: Verifier la signature
        run: jarsigner -verify -verbose -certs BEUHBEUH48-v1.aab

      - name: Fichier AAB Google Play
        uses: actions/upload-artifact@v4
        with:
          name: BEUHBEUH48-Google-Play-AAB
          path: BEUHBEUH48-v1.aab

      - name: Cle de signature A CONSERVER
        uses: actions/upload-artifact@v4
        with:
          name: BEUHBEUH48-SIGNING-KEY-KEEP-SAFE
          path: beuhbeuh48-release.jks
    
