name: Build Google Play AAB

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: "Mot de passe du keystore"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restaurer la bonne cle de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.BEUHBEUH48_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > beuhbeuh48-release.jks

      - name: Compiler AAB
        run: gradle :app:bundleRelease



      - name: Preparer AAB
        run: cp app/build/outputs/bundle/release/app-release.aab BEUHBEUH48-v1.aab

      - name: Signer AAB
        env:
          STORE_PASS: ${{ inputs.keystore_password }}
        run: |
          jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore beuhbeuh48-release.jks \
            -storepass "$STORE_PASS" \
            -keypass "$STORE_PASS" \
            BEUHBEUH48-v1.aab \
            beuhbeuh48

      - name: Verifier signature
        run: jarsigner -verify BEUHBEUH48-v1.aab

      - name: Exporter certificat PEM pour Google Play
        env:
          STORE_PASS: ${{ inputs.keystore_password }}
        run: |
          keytool -export -rfc \
            -keystore beuhbeuh48-release.jks \
            -storepass "$STORE_PASS" \
            -alias beuhbeuh48 \
            -file upload_certificate.pem

      - name: Publier certificat PEM
        uses: actions/upload-artifact@v4
        with:
          name: BEUHBEUH48-upload-certificate
          path: upload_certificate.pem

      - name: Publier AAB
        uses: actions/upload-artifact@v4
        with:
          name: BEUHBEUH48-Google-Play-AAB
          path: BEUHBEUH48-v1.aab
      - name: Compiler APK de test
        run: gradle :app:assembleRelease

      - name: Signer APK de test
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner sign \
            --ks beuhbeuh48-release.jks \
            --ks-key-alias beuhbeuh48 \
            --ks-pass pass:"${{ github.event.inputs.keystore_password }}" \
            --key-pass pass:"${{ github.event.inputs.keystore_password }}" \
            --out BEUHBEUH48-2.1.1-TEST.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Publier APK de test
        uses: actions/upload-artifact@v4
        with:
          name: BEUHBEUH48-APK-TEST-2.1.1
          path: BEUHBEUH48-2.1.1-TEST.apk
