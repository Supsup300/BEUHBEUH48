name: Build Google Play AAB

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: "Mot de passe du keystore"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Creer la cle de signature
        env:
          STORE_PASS: ${{ inputs.keystore_password }}
        run: |
          keytool -genkeypair \
            -keystore beuhbeuh48-release.jks \
            -storetype PKCS12 \
            -storepass "$STORE_PASS" \
            -alias beuhbeuh48 \
            -keypass "$STORE_PASS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=BEUHBEUH48, OU=Mobile, O=BEUHBEUH48, L=Paris, ST=Ile-de-France, C=FR"

      - name: Compiler AAB
        run: gradle :app:bundleRelease

      - name: Preparer AAB
        run: cp app/build/outputs/bundle/release/app-release.aab BEUHBEUH48-v1.aab

      - name: Signer AAB
        env:
          STORE_PASS: ${{ inputs.keystore_password }}
        run: |
          jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore beuhbeuh48-release.jks \
            -storepass "$STORE_PASS" \
            -keypass "$STORE_PASS" \
            BEUHBEUH48-v1.aab \
            beuhbeuh48

      - name: Verifier signature
        run: jarsigner -verify BEUHBEUH48-v1.aab

      - name: Publier AAB
        uses: actions/upload-artifact@v4
        with:
          name: BEUHBEUH48-Google-Play-AAB
          path: BEUHBEUH48-v1.aab

      - name: Sauvegarder cle de signature
        uses: actions/upload-artifact@v4
        with:
          name: BEUHBEUH48-SIGNING-KEY
          path: beuhbeuh48-release.jks
