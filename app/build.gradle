plugins {
    id 'com.android.application'
}

android {
    namespace 'com.beuhbeuh48.game'
    compileSdk 36

    defaultConfig {
        applicationId 'com.beuhbeuh48.game'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
